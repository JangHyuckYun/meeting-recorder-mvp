[project]
name = "meeting-mcp"
version = "0.1.0"
description = "Standalone meeting transcription MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "mcp[cli]<2",
    "websockets",
]

[project.scripts]
meeting-mcp = "meeting_mcp.server:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
